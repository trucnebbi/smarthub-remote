  const options = {
    username: AIO_USERNAME.trim(),
    password: AIO_KEY.trim(),

  const client = mqtt.connect(brokerUrl, options);

  client.on('connect', function () {
    document.getElementById('dot').className = 'status-dot online';
    document.getElementById('status-text').innerText = 'Đã kết nối Cloud Adafruit IO!';
    document.getElementById('status-text').style.color = '#2ecc71';
    console.log("✅ Kết nối MQTT Adafruit IO thành công!");
  });

  client.on('error', function (err) {
    document.getElementById('dot').className = 'status-dot';
    document.getElementById('status-text').innerText = 'Lỗi kết nối Cloud!';
    document.getElementById('status-text').style.color = '#e74c3c';
    console.error("❌ Lỗi kết nối MQTT:", err);
  });

  client.on('close', function () {
    console.warn("⚠️ Ngắt kết nối với Adafruit IO. Đang thử lại...");
  });

  function sendCmd(commandStr) {
    if (client && client.connected) {
      client.publish(AIO_TOPIC, commandStr, { qos: 0 }, (err) => {
        if (!err) {
          console.log("📤 Đã gửi lệnh Cloud: " + commandStr);
        } else {
          console.error("❌ Gửi lệnh thất bại:", err);
        }
      });
    } else {
      alert("Chưa kết nối được Cloud Adafruit IO, vui lòng kiểm tra lại mạng!");
    }
  }

  function sendDevAction(act) {
    let devIdx = document.getElementById("deviceSelector").value;
    sendCmd(devIdx + "," + act);
  }

    let name = document.getElementById("presetName").value.trim();

    sendCmd("add_preset," + name + "," + type);
    alert("Đã gửi lệnh thêm remote mới tới ESP32!");

        <div class="grid-2" style="margin:12px 0;"><button class="btn-cmd" onclick="sendDevAction('bright_up')">☀️ TĂNG SÁNG</button><button class="btn-cmd" onclick="sendDevAction('bright_down')">🌙 GIẢM SÁNG</button></div>
        <button class="btn-cmd" style="width:100%;" onclick="sendDevAction('mode')">🎨 CHUYỂN CHẾ ĐỘ MÀU</button>
      </div>`;
    }
    else if (typeVal === 19) {
      document.getElementById("curDevLabel").innerText = "STB VU+ Duo2";
      html = `<div class="remote-shell brand-generic">
        <div class="remote-header">STB VU+ DUO2</div>
        <div class="grid-2"><button class="btn-power" onclick="sendDevAction('power_toggle')">POWER</button><button class="btn-cmd" onclick="sendDevAction('mute')">MUTE</button></div>
        <div class="grid-2" style="margin-top:10px;"><button class="btn-cmd" onclick="sendDevAction('vol_up')">VOL +</button><button class="btn-cmd" onclick="sendDevAction('vol_down')">VOL -</button></div>
      </div>`;
    }
    else if (typeVal === 20) {
      document.getElementById("curDevLabel").innerText = "Apple TV";
      html = `<div class="remote-shell brand-generic">
        <div class="remote-header">APPLE TV</div>
        <div class="grid-2"><button class="btn-power-on" onclick="sendDevAction('power_on')">ON</button><button class="btn-power" onclick="sendDevAction('power_off')">OFF</button></div>
        <div class="d-pad"><button class="d-btn d-up" onclick="sendDevAction('up')">▲</button><button class="d-btn d-down" onclick="sendDevAction('down')">▼</button><button class="d-btn d-left" onclick="sendDevAction('left')">◄</button><button class="d-btn d-right" onclick="sendDevAction('right')">►</button><button class="d-btn d-ok" onclick="sendDevAction('select')">SELECT</button></div>
        <div class="grid-2"><button class="btn-cmd" onclick="sendDevAction('menu')">MENU</button><button class="btn-cmd" onclick="sendDevAction('play_pause')">PLAY / PAUSE</button></div>
      </div>`;
    }
    else if (typeVal === 21) {
      document.getElementById("curDevLabel").innerText = "Ổ cắm thông minh";
      html = `<div class="remote-shell brand-generic">
        <div class="remote-header">Ổ CẮM THÔNG MINH</div>
        <div class="grid-2"><button class="btn-power-on" style="padding:20px;" onclick="sendDevAction('power_on')">🔌 BẬT Ổ CẮM</button><button class="btn-power" style="padding:20px;" onclick="sendDevAction('power_off')">🚫 TẮT Ổ CẮM</button></div>
      </div>`;
    }

    container.innerHTML = html;
  }

  // Khởi tạo mặc định TV LG
  changeDeviceTypeUI(1);

  // Web Speech API
  let recognition = null;
  let isRecording = false;
  if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    let SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.lang = 'vi-VN';
    recognition.onstart = function() { 
      isRecording = true; 
      document.getElementById('micBtn').className = 'btn-mic recording'; 
      document.getElementById('micBtn').innerText = '🛑 ĐANG NGHE...'; 
      document.getElementById('voiceStatus').innerText = 'Đang nhận diện giọng nói...'; 
    };
    recognition.onresult = function(event) { 
      let text = event.results[0][0].transcript; 
      document.getElementById('voiceStatus').innerText = 'Lệnh: "' + text + '"'; 
      sendCmd("voice," + text); 
    };
    recognition.onerror = function() { 
      document.getElementById('voiceStatus').innerText = 'Lỗi nhận diện!'; 
      stopRec(); 
    };
    recognition.onend = function() { stopRec(); };
  }
  function toggleSpeechRecognition() { 
    if(recognition) { 
      if(isRecording) recognition.stop(); 
      else recognition.start(); 
    } else { 
      alert('Trình duyệt không hỗ trợ Web Speech API!'); 
    } 
  }
  function stopRec() { 
    isRecording = false; 
    document.getElementById('micBtn').className = 'btn-mic'; 
    document.getElementById('micBtn').innerText = '🎤 NÓI ĐỂ ĐIỀU KHIỂN CLOUD'; 
  }
</script>
